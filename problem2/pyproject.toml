[project]
name = "mini-agent"
version = "0.1.0"
description = "Mini Code Agent: a command-line coding agent with a hand-written agent loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.5.0",
    "httpx>=0.28.1",
    "openai>=3.55.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
mini-agent = "mini_agent.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q"
